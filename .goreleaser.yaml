version: 2

builds:
  - id: pivot
    binary: pivot
    main: ./cmd/pivot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/namdang-fdp/pivot/internal/buildinfo.Version={{.Version}}
        -X github.com/namdang-fdp/pivot/internal/buildinfo.Commit={{.Commit}}
        -X github.com/namdang-fdp/pivot/internal/buildinfo.Date={{.Date}}

archives:
  - id: pivot
    ids:
      - pivot
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
